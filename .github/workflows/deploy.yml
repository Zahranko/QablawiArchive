name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time. A second push waits rather than racing the first
  # over the same FTP connection.
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Lint and sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Keep this matching the PHP version set in hPanel, so a syntax
          # error caught here is the same one the server would hit.
          php-version: '8.2'
          extensions: fileinfo, mbstring
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -path ./.git -prune -o -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Require uploads/.htaccess
        # This file is what stops an uploaded script from ever executing.
        # If it is missing the deploy must not proceed.
        run: |
          test -f uploads/.htaccess || {
            echo "::error file=uploads/.htaccess::uploads/.htaccess is missing — refusing to deploy."
            exit 1
          }
          grep -q 'engine off' uploads/.htaccess || {
            echo "::error file=uploads/.htaccess::uploads/.htaccess no longer disables the PHP engine."
            exit 1
          }

  deploy:
    name: Publish over FTPS
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger accepts explicit FTPS on port 21. Switch to `ftp` only
          # if TLS negotiation fails, and understand you are then sending the
          # password in clear text.
          protocol: ftps
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Off by default, and it must stay off: a clean slate would wipe
          # every file a visitor has uploaded.
          dangerous-clean-slate: false
          # Overriding `exclude` replaces the action's defaults, so the .git
          # entries have to be repeated here.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            .gitignore

      # Files in uploads/ are safe: the action only removes remote files it
      # previously deployed, and visitor uploads were never in that set.
